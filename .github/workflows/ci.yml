name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run the exhaustive float accuracy test
        type: boolean
        default: false
      dense:
        description: Run only the dense double sweep
        type: boolean
        default: false
      dense_samples:
        description: Samples per double function in the dense sweep
        type: string
        default: "100000000"
      benchmarks:
        description: Collect native x86 throughput and latency artifacts
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > "$RUNNER_TEMP/wray-changes"
            code=false
            while IFS= read -r path; do
              case "$path" in
                *.md|LICENSE|docs/*) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/wray-changes"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: python -m pip install -r tools/requirements.txt ninja

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWRAY_SIMD=avx2 -DWRAY_BUILD_TESTS=OFF -DWRAY_BUILD_BENCH=OFF

      - run: cmake --build build --target wray_dump

      - run: python tools/docs/check_readme.py --dump build/tools/wray_dump

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64-appleclang-neon, os: macos-15, cxx: clang++, simd: auto }
          - { name: linux-x64-gcc14-sse2, os: ubuntu-24.04, cxx: g++-14, simd: sse2 }
          - { name: linux-x64-clang18-sse2, os: ubuntu-24.04, cxx: clang++-18, simd: sse2 }
          - { name: linux-x64-gcc14-avx2, os: ubuntu-24.04, cxx: g++-14, simd: avx2 }
          - { name: linux-x64-clang18-avx2, os: ubuntu-24.04, cxx: clang++-18, simd: avx2 }
          - { name: linux-x64-gcc14-avx512, os: ubuntu-24.04, cxx: g++-14, simd: avx512 }
          - { name: linux-x64-clang18-avx512, os: ubuntu-24.04, cxx: clang++-18, simd: avx512 }
          - { name: windows-x64-msvc-avx512, os: windows-2022, cxx: cl, simd: avx512 }
          - { name: linux-x64-gcc14-scalar, os: ubuntu-24.04, cxx: g++-14, simd: scalar }
          - { name: linux-arm64-gcc14-neon, os: ubuntu-24.04-arm, cxx: g++-14, simd: auto }
          - { name: macos-arm64-appleclang-neon-cxx20, os: macos-15, cxx: clang++, simd: auto, std: 20 }
          - { name: linux-x64-gcc14-sse2-cxx20, os: ubuntu-24.04, cxx: g++-14, simd: sse2, std: 20 }
          - { name: linux-arm64-gcc14-neon-cxx20, os: ubuntu-24.04-arm, cxx: g++-14, simd: auto, std: 20 }
          - { name: linux-x64-clang18-scalar-ubsan, os: ubuntu-24.04, cxx: clang++-18, simd: scalar, flags: -fsanitize=undefined -fno-sanitize-recover=all }
          - { name: linux-x64-clang18-avx2-ubsan-asan, os: ubuntu-24.04, cxx: clang++-18, simd: avx2, flags: -fsanitize=undefined,address -fno-sanitize-recover=all }
          - { name: linux-arm64-clang18-neon-ubsan, os: ubuntu-24.04-arm, cxx: clang++-18, simd: auto, flags: -fsanitize=undefined -fno-sanitize-recover=all }
          - { name: windows-x64-msvc-sse2, os: windows-2022, cxx: cl, simd: sse2 }
          - { name: windows-x64-msvc-avx2, os: windows-2022, cxx: cl, simd: avx2 }
          - { name: windows-arm64-msvc-neon, os: windows-11-arm, cxx: cl, simd: auto, arch: arm64, pyarch: x64 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: python -m pip install -r tools/requirements.txt ninja

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch || 'x64' }}

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.std || 23 }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DWRAY_SIMD=${{ matrix.simd }} -DWRAY_BUILD_C_API=ON -DWRAY_PYTHON="${{ steps.python.outputs.python-path }}"

      - run: cmake --build build

      - id: native
        shell: bash
        run: |
          native=true
          if [ "${{ matrix.simd }}" = avx512 ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              supported=$(pwsh -NoProfile -Command '[System.Runtime.Intrinsics.X86.Avx512F]::IsSupported -and [System.Runtime.Intrinsics.X86.Avx512BW]::IsSupported -and [System.Runtime.Intrinsics.X86.Avx512DQ]::IsSupported')
            else
              supported=$(grep -qw avx512f /proc/cpuinfo && echo True || echo False)
            fi
            if [ "$supported" != True ]; then
              native=false
              echo "::notice::runner CPU lacks AVX-512; ${{ matrix.name }} is compile-only and avx512-coverage requires another AVX-512 job to run"
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

      - if: steps.native.outputs.native == 'true'
        run: ctest --test-dir build -LE "exhaustive|oracle" --output-on-failure

      - if: steps.native.outputs.native == 'true'
        run: python tools/oracle/oracle.py --dump build/tools/wray_dump --out build/accuracy.json --check

      - if: matrix.simd == 'avx512' && steps.native.outputs.native == 'true'
        shell: bash
        run: echo "${{ matrix.name }}" > avx512-native.txt

      - if: matrix.simd == 'avx512' && steps.native.outputs.native == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: avx512-native-${{ matrix.name }}
          path: avx512-native.txt

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accuracy-${{ matrix.name }}
          path: build/accuracy.json
          if-no-files-found: ignore

  strict-warnings:
    name: strict-warnings-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2022, arch: x64 }
          - { name: windows-arm64, os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - if: runner.os == 'Linux'
        shell: bash
        run: |
          flags=(-std=c++20 -O1 -ffp-contract=off -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wdouble-promotion -Wold-style-cast -Wshadow -Werror -I include)
          if [ "$(uname -m)" = x86_64 ]; then simd=("-msse2 -mno-avx" "-mavx2 -mfma" "-mavx512f -mavx2 -mfma" "-DWRAY_SIMD_SCALAR=1"); else simd=("" "-DWRAY_SIMD_SCALAR=1"); fi
          for cxx in g++-14 clang++-18; do
            for s in "${simd[@]}"; do
              echo "$cxx $s"
              read -r -a isa <<< "$s"
              "$cxx" "${flags[@]}" "${isa[@]}" -c tests/consumer/strict.cpp -o strict.o
            done
          done

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $variants = if ("${{ matrix.arch }}" -eq "x64") { @("", "/arch:AVX2", "/arch:AVX512", "/DWRAY_SIMD_SCALAR=1") } else { @("", "/DWRAY_SIMD_SCALAR=1") }
          foreach ($v in $variants) {
            Write-Output "cl $v"
            $cl = @("/nologo", "/std:c++20", "/O1", "/fp:precise", "/EHsc", "/W4", "/WX", "/Iinclude", "/c", "tests/consumer/strict.cpp", "/Fostrict.obj")
            if ($v -ne "") { $cl += $v }
            & cl @cl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  hostility:
    name: hostility-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - run: sudo apt-get install -y ninja-build

      - name: unsafe floating-point flags
        run: |
          tools/ci/hostile_flags.sh g++-14
          tools/ci/hostile_flags.sh clang++-18

      - name: consumers without the CMake target
        run: |
          extra=()
          if [ "$(uname -m)" = x86_64 ]; then extra=(-mavx2 -mfma); fi
          for std in -std=gnu++20 -std=c++20; do
            tools/ci/header_only.sh g++-14 $std
            tools/ci/header_only.sh clang++-18 $std
            tools/ci/header_only.sh g++-14 "$std" "${extra[@]}"
            tools/ci/header_only.sh clang++-18 "$std" "${extra[@]}"
          done

      - name: translation units with different SIMD flags in one program
        if: runner.arch == 'X64'
        run: |
          tools/ci/mixed_link.sh g++-14
          tools/ci/mixed_link.sh clang++-18

      - name: installed package consumer
        run: |
          cmake -S . -B install-build -G Ninja -DWRAY_INSTALL=ON -DWRAY_BUILD_TESTS=OFF -DWRAY_BUILD_TOOLS=OFF -DWRAY_BUILD_BENCH=OFF -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --install install-build
          cmake -S tests/consumer/find_package -B consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer
          ./consumer/wray_consumer

  hostility-windows:
    name: hostility-windows-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-2022 }
          - { arch: arm64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}

      - shell: pwsh
        run: |
          $out = & cl /nologo /std:c++20 /O2 /fp:fast /EHsc /Iinclude /c tests/consumer/strict.cpp /Fostrict.obj 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $out -notmatch "wray relies") { Write-Output $out; Write-Output "/fp:fast was not rejected"; exit 1 }
          & cl /nologo /std:c++20 /O2 /fp:precise /fp:contract /EHsc /Iinclude tests/consumer/strict.cpp /Fe:strict.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = & ./strict.exe
          Write-Output "/fp:contract: $result"
          if (-not $result.StartsWith("1 ")) { Write-Output "/fp:contract changed the floating-point model inside wray"; exit 1 }

  debug:
    name: debug-O0
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - run: sudo apt-get install -y ninja-build

      - run: CXX=g++-14 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWRAY_BUILD_BENCH=OFF -DWRAY_BUILD_C_API=ON

      - run: cmake --build build

      - run: ctest --test-dir build -j 4 -LE "exhaustive|oracle|accuracy" -E "filters|spectral" --output-on-failure

  exhaustive:
    name: exhaustive-${{ matrix.name }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.exhaustive)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64-appleclang-neon, os: macos-15, cxx: clang++, simd: auto }
          - { name: linux-x64-gcc14-avx2, os: ubuntu-24.04, cxx: g++-14, simd: avx2 }
          - { name: linux-x64-gcc14-sse2, os: ubuntu-24.04, cxx: g++-14, simd: sse2 }
          - { name: linux-x64-gcc14-scalar, os: ubuntu-24.04, cxx: g++-14, simd: scalar }
          - { name: linux-x64-gcc14-avx512, os: ubuntu-24.04, cxx: g++-14, simd: avx512 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - run: python -m pip install ninja

      - if: matrix.simd == 'avx512'
        shell: bash
        run: |
          if ! grep -qw avx512f /proc/cpuinfo; then
            echo "::error::runner CPU lacks AVX-512F; re-run ${{ matrix.name }}"
            exit 1
          fi

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWRAY_SIMD=${{ matrix.simd }} -DWRAY_BUILD_BENCH=OFF

      - run: cmake --build build --target wray_accuracy_test

      - run: ctest --test-dir build -L exhaustive --output-on-failure

  double-dense:
    name: double-dense-${{ matrix.simd }}-${{ matrix.shard }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.exhaustive || inputs.dense))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        simd: [avx2, sse2]
        shard: [0, 1, 2, 3]
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: python -m pip install -r tools/requirements.txt ninja

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWRAY_SIMD=${{ matrix.simd }} -DWRAY_BUILD_BENCH=OFF -DWRAY_BUILD_TESTS=OFF

      - run: cmake --build build --target wray_dense

      - run: python tools/dense/gate.py --dense build/tools/wray_dense --samples ${{ inputs.dense_samples || '100000000' }} --seed ${{ github.run_number }} --verify 500 --shard ${{ matrix.shard }}/4

  mutants:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: python -m pip install -r tools/requirements.txt ninja

      - run: python tools/ci/mutants.py

  avx512-coverage:
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern "avx512-native-*" --dir avx512 || true
          if ! ls avx512/*/avx512-native.txt >/dev/null 2>&1; then
            echo "::error::no AVX-512 job ran on AVX-512 hardware; re-run the failed jobs"
            exit 1
          fi
          cat avx512/*/avx512-native.txt

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-22, os: ubuntu-22.04, cxx: g++ }
          - { name: linux-24, os: ubuntu-24.04, cxx: g++-14 }
          - { name: windows-22, os: windows-2022, cxx: cl }
          - { name: windows-25, os: windows-2025, cxx: cl }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - run: python -m pip install ninja

      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/sleef
          key: sleef-3.9.0-${{ matrix.os }}-${{ matrix.cxx }}

      - if: runner.os == 'Linux'
        run: |
          if [ ! -f "$HOME/sleef/lib/cmake/sleef/sleefConfig.cmake" ]; then
            curl -fsSL https://github.com/shibatch/sleef/archive/refs/tags/3.9.0.tar.gz -o "$RUNNER_TEMP/sleef.tar.gz"
            echo "af60856abac08a3b5e72a8d156dd71fec1f7ac23de8ee67793f45f9edcdf0908  $RUNNER_TEMP/sleef.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/sleef.tar.gz" -C "$RUNNER_TEMP"
            cmake -S "$RUNNER_TEMP/sleef-3.9.0" -B "$RUNNER_TEMP/sleef-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="${CXX/g++/gcc}" -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_INSTALL_PREFIX="$HOME/sleef" -DSLEEF_BUILD_TESTS=OFF -DSLEEF_BUILD_DFT=OFF -DSLEEF_BUILD_QUAD=OFF \
              -DSLEEF_BUILD_GNUABI_LIBS=OFF -DSLEEF_BUILD_SCALAR_LIB=OFF -DSLEEF_BUILD_INLINE_HEADERS=OFF
            cmake --build "$RUNNER_TEMP/sleef-build"
            cmake --install "$RUNNER_TEMP/sleef-build"
          fi
          echo "CMAKE_PREFIX_PATH=$HOME/sleef" >> "$GITHUB_ENV"

      - run: python tools/ci/benchmark.py --out benchmark-results

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-${{ matrix.name }}
          path: benchmark-results
          if-no-files-found: error

  benchmark-summary:
    needs: benchmark
    if: always() && github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --pattern "benchmark-*" --dir benchmark-results

      - run: |
          python - <<'PY'
          import json
          import pathlib
          measured = set()
          competitors = []
          for path in pathlib.Path("benchmark-results").rglob("bench-*.json"):
              data = json.loads(path.read_text())
              measured.add(data["meta"]["backend"])
              if data["meta"]["platform"].startswith("Linux"):
                  competitors.append((path, data["meta"]["vector_baselines"]))
              print(data["meta"]["platform"], data["meta"]["cpu"], data["meta"]["backend"])
          missing = {"sse2", "avx2", "avx512"} - measured
          if missing:
              raise SystemExit("Native benchmark coverage missing: " + ", ".join(sorted(missing)))
          absent = [str(path) for path, names in competitors if "sleef" not in names or "libmvec" not in names]
          if not competitors or absent:
              raise SystemExit("Linux benchmarks must measure SLEEF and glibc libmvec: " + ", ".join(absent or ["no Linux runs"]))
          PY

  ci-pass:
    if: always()
    needs: [changes, docs, test, avx512-coverage, strict-warnings, hostility, hostility-windows, debug, mutants, exhaustive, double-dense, benchmark-summary]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
