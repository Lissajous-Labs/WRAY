name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run the exhaustive float accuracy test
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64-appleclang-neon, os: macos-15, cxx: clang++, simd: auto }
          - { name: linux-x64-gcc14-sse2, os: ubuntu-24.04, cxx: g++-14, simd: sse2 }
          - { name: linux-x64-clang18-sse2, os: ubuntu-24.04, cxx: clang++-18, simd: sse2 }
          - { name: linux-x64-gcc14-avx2, os: ubuntu-24.04, cxx: g++-14, simd: avx2 }
          - { name: linux-x64-clang18-avx2, os: ubuntu-24.04, cxx: clang++-18, simd: avx2 }
          - { name: linux-x64-gcc14-avx512, os: ubuntu-24.04, cxx: g++-14, simd: avx512 }
          - { name: linux-x64-gcc14-scalar, os: ubuntu-24.04, cxx: g++-14, simd: scalar }
          - { name: linux-arm64-gcc14-neon, os: ubuntu-24.04-arm, cxx: g++-14, simd: auto }
          - { name: macos-arm64-appleclang-neon-cxx20, os: macos-15, cxx: clang++, simd: auto, std: 20 }
          - { name: linux-x64-gcc14-sse2-cxx20, os: ubuntu-24.04, cxx: g++-14, simd: sse2, std: 20 }
          - { name: linux-arm64-gcc14-neon-cxx20, os: ubuntu-24.04-arm, cxx: g++-14, simd: auto, std: 20 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: python -m pip install -r tools/requirements.txt ninja

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.std || 23 }} -DWRAY_SIMD=${{ matrix.simd }} -DWRAY_PYTHON="${{ steps.python.outputs.python-path }}"

      - run: cmake --build build

      - id: cpu
        shell: bash
        run: |
          if [ "${{ matrix.simd }}" != avx512 ] || grep -qw avx512f /proc/cpuinfo; then
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          else
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::runner CPU lacks AVX-512F; ${{ matrix.name }} is compile-only"
          fi

      - if: steps.cpu.outputs.runnable == 'true'
        run: ctest --test-dir build -LE "exhaustive|oracle" --output-on-failure

      - if: steps.cpu.outputs.runnable == 'true'
        run: python tools/oracle/oracle.py --dump build/tools/wray_dump --out build/accuracy.json --check

      - if: always() && steps.cpu.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-${{ matrix.name }}
          path: build/accuracy.json
          if-no-files-found: ignore

  exhaustive:
    name: exhaustive-${{ matrix.name }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.exhaustive)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64-appleclang-neon, os: macos-15, cxx: clang++, simd: auto }
          - { name: linux-x64-gcc14-avx2, os: ubuntu-24.04, cxx: g++-14, simd: avx2 }
          - { name: linux-x64-gcc14-sse2, os: ubuntu-24.04, cxx: g++-14, simd: sse2 }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install ninja

      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWRAY_SIMD=${{ matrix.simd }} -DWRAY_BUILD_BENCH=OFF

      - run: cmake --build build --target wray_accuracy_test

      - run: ctest --test-dir build -L exhaustive --output-on-failure
